name: Build FilpFlapCore

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Zbuduj plugin
        run: mvn -B clean package -DskipTests

      - name: Udostępnij plugin
        uses: actions/upload-artifact@v4
        with:
          name: FilpFlapCore
          path: target/*.jar
